[build-system]
requires = ["rattler-build"]
build-backend = "rattler_build.build"

[project]
name = "sleap"
description = "SLEAP (Social LEAP Estimates Animal Poses) is a deep learning framework for animal pose tracking."
authors = [
    {name = "Liezl Maree", email = "lmaree@salk.edu"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}
]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11,<3.14"
keywords = ["deep learning", "pose estimation", "tracking", "neuroscience"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
version = "1.0.0"  # Static version for rattler-build
readme = "README.md"
dependencies = [
    "attrs",
    "omegaconf",
    "imageio",
    "imageio-ffmpeg",
    "imgstore",
    "jsmin",
    "jsonpickle",
    "markupsafe",
    "ndx-pose",
    "networkx",
    "nixio",
    "numpy",
    "opencv-python",
    "pandas",
    "psutil",
    "pykalman",
    "pynwb",
    "PySide6",
    "python-rapidjson",
    "pyyaml",
    "pyzmq",
    "qtpy",
    "rich",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "urllib3",
    "albumentations",
    "requests",
    "matplotlib",
    "sleap-io[all]>=0.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt>=4.4.0",
    "pytest-xvfb",
    "ruff",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-jupyter",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mike",
]

jupyter = [
    "jupyter",
    "jupyterlab",
]

nn = [
    "sleap-nn>=0.0.4"
]

[project.urls]
Homepage = "https://sleap.ai"
Documentation = "https://sleap.ai/"
"Bug Tracker" = "https://github.com/talmolab/sleap/issues"
"Source Code" = "https://github.com/talmolab/sleap"

[project.scripts]
sleap-convert = "sleap.io.convert:main"
sleap-render = "sleap.io.visuals:main"
sleap-label = "sleap.gui.app:main"
sleap-inspect = "sleap.info.labels:main"
sleap-diagnostic = "sleap.diagnostic:main"
sleap-train = "sleap.legacy_cli_adaptors:train_command"
sleap-track = "sleap.legacy_cli_adaptors:track_command"
sleap-nn-train = "sleap.cli:train"
sleap-nn-track = "sleap.cli:track"

[tool.pixi.project]
name = "sleap"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
sleap = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
pytorch = ">=2.0"
torchvision = ">=0.15"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E721",
    "E731",
    "E741",
    "F405",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["F403", "F405"]